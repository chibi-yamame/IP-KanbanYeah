name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch / PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build src/KanbanDrawer -c Release
      - name: Unit tests
        run: dotnet test tests/KanbanDrawer.Tests -c Release --logger "console;verbosity=normal"
